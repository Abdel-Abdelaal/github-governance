name: Fleet health
on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fleet-health
  cancel-in-progress: false
jobs:
  report:
    name: Fleet health report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yq -o=json '.' repos.yaml > "$RUNNER_TEMP/repos.json"
          python tools/fleet_report.py build --repos "$RUNNER_TEMP/repos.json" --output "$RUNNER_TEMP/fleet-health.md"
          cat "$RUNNER_TEMP/fleet-health.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/fleet_report.py publish --body "$RUNNER_TEMP/fleet-health.md"
      - name: Report scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search '"Governance workflow failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Scheduled fleet health failed: $RUN_URL"
          else
            gh issue create --title 'Governance workflow failed' --label governance --body "Scheduled fleet health failed: $RUN_URL"
          fi
