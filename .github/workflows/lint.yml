name: Lint
on:
  pull_request:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  lint:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/lint.yml@7b7bea4e50c6ee1b1dcf0d318e4504655678b0b8 # v1.9.1
    permissions:
      contents: read
    with:
      full-scan: ${{ github.event_name != 'pull_request' }}
