name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  security:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/security.yml@7b7bea4e50c6ee1b1dcf0d318e4504655678b0b8 # v1.9.1
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      languages: auto
  report:
    needs: security
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@7b7bea4e50c6ee1b1dcf0d318e4504655678b0b8 # v1.9.1
    permissions:
      issues: write
    with:
      title: Weekly security checks failed
