name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  security:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/security.yml@c047928d7555f1f9e6e2ab56e6e9d3bfa79cdc2c # v1.2.0
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      languages: '["python","actions"]'
  report:
    needs: security
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@c047928d7555f1f9e6e2ab56e6e9d3bfa79cdc2c # v1.2.0
    permissions:
      issues: write
    with:
      title: Weekly security checks failed
