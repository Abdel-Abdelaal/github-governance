name: Dependency inventory
on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: dependency-inventory
  cancel-in-progress: false
jobs:
  inventory:
    name: Dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yq -o=json '.' repos.yaml > "$RUNNER_TEMP/repos.json"
          python tools/dependency_inventory.py build --repos "$RUNNER_TEMP/repos.json" \
            --output "$RUNNER_TEMP/dependency-inventory.md" --json "$RUNNER_TEMP/dependency-inventory.json"
          cat "$RUNNER_TEMP/dependency-inventory.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-inventory
          path: ${{ runner.temp }}/dependency-inventory.json
          retention-days: 90
      - name: Publish tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/dependency_inventory.py publish --body "$RUNNER_TEMP/dependency-inventory.md"
      - name: Report scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search '"Governance workflow failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Scheduled dependency inventory failed: $RUN_URL"
          else
            gh issue create --title 'Governance workflow failed' --label governance --body "Scheduled dependency inventory failed: $RUN_URL"
          fi
