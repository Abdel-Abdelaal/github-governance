name: AI coding review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id != 49699333
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/ai-review.yml@e26d5b07bdee2fc54ed5bd607d8041f7fbeaadaf # v1.5.0
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
