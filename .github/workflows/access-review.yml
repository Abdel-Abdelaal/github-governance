name: Access review
on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: access-review
  cancel-in-progress: false
jobs:
  review:
    name: Access review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check owner setup
        id: setup
        env:
          APP_ID: ${{ secrets.GOV_APP_ID }}
          APP_KEY: ${{ secrets.GOV_APP_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Governance App not configured: admin-only sections are reported as skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.setup.outputs.ready == 'true'
        id: app
        with:
          app-id: ${{ secrets.GOV_APP_ID }}
          private-key: ${{ secrets.GOV_APP_KEY }}
          owner: Abdel-Abdelaal
          repositories: .github,platform-workflows,shortlink,github-governance
          permission-administration: read
          permission-secrets: read
      - name: Build review
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          yq -o=json '.' repos.yaml > "$RUNNER_TEMP/repos.json"
          python tools/access_review.py build --repos "$RUNNER_TEMP/repos.json" --output "$RUNNER_TEMP/access-review.md"
          cat "$RUNNER_TEMP/access-review.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/access_review.py publish --body "$RUNNER_TEMP/access-review.md"
      - name: Report scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --search '"Governance workflow failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Scheduled access review failed: $RUN_URL"
          else
            gh issue create --title 'Governance workflow failed' --label governance --body "Scheduled access review failed: $RUN_URL"
          fi
