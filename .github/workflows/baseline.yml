name: Weekly baseline update
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  baseline:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/baseline-sync.yml@9963dc1ffc49cff752cc62f2ec9c1651bdb3f482 # v1.6.0
    permissions:
      contents: read
      issues: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
