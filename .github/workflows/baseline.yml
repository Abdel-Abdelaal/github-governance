name: Weekly baseline update
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  baseline:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/baseline-sync.yml@40e5261e2e39d8d0c88e709c26385cab3cc43466 # v1.7.0
    permissions:
      contents: read
      issues: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
