name: Weekly baseline update
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  baseline:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/baseline-sync.yml@ee62b8d7843ace6e55aa77cf6b8652da5cb62a83 # v1.4.0
    permissions:
      contents: read
      issues: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
