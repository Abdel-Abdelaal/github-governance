name: AI telemetry dashboard
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - ai-telemetry/**
      - tools/ai_telemetry_dashboard.py
      - tools/ai_redteam_dashboard.py
      - tests/test_ai_telemetry_dashboard.py
      - tests/test_ai_redteam_dashboard.py
      - .github/workflows/ai-telemetry-dashboard.yml
permissions: {}
concurrency:
  group: ai-telemetry-dashboard-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
jobs:
  archive-redteam:
    name: Verify and retain public red-team evidence
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and stage signed source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ai_redteam_dashboard.py stage --directory "$RUNNER_TEMP/redteam-evidence"
      - name: Secret-scan verified evidence before durable upload
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/redteam-evidence" --redact --no-banner --exit-code 1
      - name: Archive immutable signed subjects and bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ai_redteam_dashboard.py upload --directory "$RUNNER_TEMP/redteam-evidence"
  build:
    name: Verify and aggregate AI records
    needs: archive-redteam
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate aggregation and prepare static files
        run: |
          python -m unittest discover -s tests -p 'test_ai*dashboard.py' -v
          mkdir -p "$RUNNER_TEMP/ai-dashboard"
          cp ai-telemetry/* "$RUNNER_TEMP/ai-dashboard/"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ai-dashboard"
          page = root / "index.html"
          version = os.environ["GITHUB_SHA"]
          text = page.read_text(encoding="utf-8")
          for asset in ("dashboard.js", "style.css"):
              text = text.replace(f'"{asset}"', f'"{asset}?v={version}"')
          page.write_text(text, encoding="utf-8")
          PY
      - name: Collect signed public release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REDTEAM_ARCHIVE_RESULT: ${{ needs.archive-redteam.result }}
        run: |
          yq -o=json '.' repos.yaml > "$RUNNER_TEMP/repos.json"
          python tools/ai_telemetry_dashboard.py --repos "$RUNNER_TEMP/repos.json" --output "$RUNNER_TEMP/ai-dashboard" --discover-public --include-redteam --include-agents
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/ai-dashboard
  deploy:
    name: Publish verified metrics
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  report:
    needs: [archive-redteam, build, deploy]
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@7b7bea4e50c6ee1b1dcf0d318e4504655678b0b8 # v1.9.1
    permissions:
      issues: write
    with:
      title: AI telemetry dashboard collection failed
