name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Deny everything by default; each job asks for only what it needs.
permissions: {}

jobs:
  pr-title:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/pr-title.yml@7b7bea4e50c6ee1b1dcf0d318e4504655678b0b8 # v1.9.1
    permissions:
      pull-requests: read
