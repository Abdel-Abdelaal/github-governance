name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Deny everything by default; each job asks for only what it needs.
permissions: {}

jobs:
  pr-title:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/pr-title.yml@e26d5b07bdee2fc54ed5bd607d8041f7fbeaadaf # v1.5.0
    permissions:
      pull-requests: read
