name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Deny everything by default; each job asks for only what it needs.
permissions: {}

jobs:
  pr-title:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/pr-title.yml@9963dc1ffc49cff752cc62f2ec9c1651bdb3f482 # v1.6.0
    permissions:
      pull-requests: read
