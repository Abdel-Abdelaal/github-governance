name: Weekly AI maintenance
on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  audit:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/ai-audit.yml@7b7bea4e50c6ee1b1dcf0d318e4504655678b0b8 # v1.9.1
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
      checks: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
  fix:
    needs: audit
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/ai-fix.yml@7b7bea4e50c6ee1b1dcf0d318e4504655678b0b8 # v1.9.1
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
      checks: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
