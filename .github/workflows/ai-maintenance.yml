name: Weekly AI maintenance
on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  audit:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/ai-audit.yml@fac9ee28b0217a9d65e97a866bb87dfe1b92b0f2 # v1.7.0
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
      checks: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
  fix:
    needs: audit
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/ai-fix.yml@fac9ee28b0217a9d65e97a866bb87dfe1b92b0f2 # v1.7.0
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
      checks: write
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
