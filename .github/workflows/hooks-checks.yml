name: Frozen hook checks
on:
  pull_request:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  hooks:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/hooks.yml@f06eb74320f169fa6ce3690b0cd44ccfba8f199b # v1.8.0
    permissions:
      contents: read
      issues: write
    with:
      configuration: .pre-commit-config.yaml
