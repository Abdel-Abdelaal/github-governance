name: Frozen hook checks
on:
  pull_request:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  hooks:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/hooks.yml@40e5261e2e39d8d0c88e709c26385cab3cc43466 # v1.7.0
    permissions:
      contents: read
      issues: write
    with:
      configuration: .pre-commit-config.yaml
