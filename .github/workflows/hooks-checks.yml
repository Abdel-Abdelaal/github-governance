name: Frozen hook checks
on:
  pull_request:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  hooks:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/hooks.yml@aa42de723a82473499d8744c37ed4e571c868354 # v1.12.0
    permissions:
      contents: read
      issues: write
    with:
      configuration: .pre-commit-config.yaml
