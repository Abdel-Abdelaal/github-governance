name: Frozen hook checks
on:
  pull_request:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  hooks:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/hooks.yml@40b37ce9647cc6cde2adc3d3d1acfc0aa06f92c9 # v1.10.0
    permissions:
      contents: read
      issues: write
    with:
      configuration: .pre-commit-config.yaml
