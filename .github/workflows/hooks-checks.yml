name: Frozen hook checks
on:
  pull_request:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  hooks:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/hooks.yml@7b7bea4e50c6ee1b1dcf0d318e4504655678b0b8 # v1.9.1
    permissions:
      contents: read
      issues: write
    with:
      configuration: .pre-commit-config.yaml
