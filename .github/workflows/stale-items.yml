name: Stale items
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect without changing issues or pull requests
        type: boolean
        default: true
permissions: {}
jobs:
  stale:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/stale.yml@fac9ee28b0217a9d65e97a866bb87dfe1b92b0f2 # v1.7.0
    permissions:
      issues: write
      pull-requests: write
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
