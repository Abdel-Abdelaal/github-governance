defaults:
  visibility: public
  has_wiki: false
  has_projects: false
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  allow_auto_merge: true
  allow_update_branch: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  vulnerability_alerts: true
  secret_scanning: true
  secret_scanning_push_protection: true
  required_checks:
  - pr-title / Conventional title
  - security / CodeQL (actions)
  - security / Dependency review
  - security / Secrets
  - security / Workflows
  - conformance / Conformance
repos:
  ello:
    description: Android assistant application with shared security checks and measured AI review
  youtube-knowledge-distillation:
    description: Cited knowledge-distillation research kit with shared security and AI evidence
  agent-dispatcher:
    description: Serial, quota-aware dispatcher that turns owner-labelled issues into gated draft PRs using official AI coding CLIs
    required_checks:
    - pr-title / Conventional title
    - security / CodeQL (actions)
    - security / Dependency review
    - security / Secrets
    - security / Workflows
    - ci / Lint
    - ci / Types
    - ci / Test
    - ci / Audit
    - security / CodeQL (python)
    - conformance / Conformance
  .github:
    description: Engineering handbook and default community files for all my repos
  platform-workflows:
    description: Reusable GitHub Actions workflows for my repos
    required_checks:
    - pr-title / Conventional title
    - security / CodeQL (actions)
    - security / Dependency review
    - security / Secrets
    - security / Workflows
    - ci / Lint
    - ci / Types
    - ci / Test
    - ci / Audit
    - security / CodeQL (python)
    - conformance / Conformance
  shortlink:
    description: FastAPI URL shortener with enterprise-grade CI/CD, security scanning and AI review
    required_checks:
    - pr-title / Conventional title
    - security / CodeQL (actions)
    - security / Dependency review
    - security / Secrets
    - security / Workflows
    - ci / Lint
    - ci / Types
    - ci / Test
    - ci / Audit
    - security / CodeQL (python)
    - conformance / Conformance
    - Build, smoke and scan
  github-governance:
    description: All my GitHub repo settings, rulesets and labels as Terraform
    required_checks:
    - pr-title / Conventional title
    - security / CodeQL (actions)
    - security / Dependency review
    - security / Secrets
    - security / Workflows
    - Validate
    - security / CodeQL (python)
    - conformance / Conformance
